spring.application.name=booking-service
server.port=5003

spring.data.mongodb.uri=${MONGODB_URI_BOOKING}

# Downstream service base URLs (in production these would be resolved via
# service discovery; here they are called directly, coordinated by the API Gateway)
services.user.base-url=http://localhost:5001
services.hotel.base-url=http://localhost:5002
services.payment.base-url=http://localhost:5004
services.notification.base-url=http://localhost:5005

logging.level.com.hbms.booking=INFO
